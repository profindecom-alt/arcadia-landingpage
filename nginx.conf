# Cache policy. Pages and config.js are always revalidated (changes go live at once).
# CSS/JS are linked as file.js?v=<hash> (scripts/build-versions.cjs) → cached 1 year, a change gets a new URL.
# Fonts never change → 1 year. Images → 30 days.
map $request_uri $cache_control {
  default                                         "no-cache";
  ~^/assets/config\.js                            "no-cache";
  ~*\.(?:css|js)\?v=                              "public, max-age=31536000, immutable";
  ~*\.(?:css|js)(?:\?|$)                          "public, max-age=3600";
  ~*\.woff2(?:\?|$)                               "public, max-age=31536000, immutable";
  ~*\.(?:webp|png|jpe?g|gif|svg|ico|avif)(?:\?|$) "public, max-age=2592000";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Behind Coolify's proxy: keep redirects relative (/form → /form/ stays on https + the right host).
  absolute_redirect off;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Unknown URL (old ad link, typo) → main landing page.
  error_page 404 = @home;
  location @home { return 302 /; }

  location ~ /\. { deny all; }
}
